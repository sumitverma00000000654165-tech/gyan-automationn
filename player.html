<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- IMPORTANT: YouTube "Error 153" fix – referrer must be sent, and page must open on https:// (not file://) -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Live &amp; Recorded Classes – Gyan Automation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.css">
<style>
:root{--bg:#0b1220;--card:#111a2e;--line:#1e2a44;--txt:#e8eefc;--mut:#8ea0c4;--pri:#0ea5e9;--plyr-color-main:#0ea5e9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{min-height:100vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* sticky header */
.top{position:sticky;top:0;z-index:60;height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(11,18,32,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top a{color:var(--txt);text-decoration:none;font-size:22px;line-height:1}
.top h1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:980px;margin:0 auto}
/* strict 16:9 box – no extra black space */
.stage{position:sticky;top:52px;z-index:50;background:#000}
.box{position:relative;width:100%;padding-top:56.25%;background:#000;overflow:hidden}
.in{position:absolute;inset:0}
.in .plyr{height:100%;width:100%}
.in .plyr__video-wrapper{background:#000}
.in iframe,.in video{border:0;width:100%;height:100%;display:block}
.in>iframe,.in>video{position:absolute;inset:0}
.plyr--youtube .plyr__video-embed iframe{transform:scale(1.18);transform-origin:center center}   /* crop YouTube title / logo / suggestions */
/* overlays inside plyr wrapper */
.shield{position:absolute;left:0;right:0;top:0;bottom:45px;z-index:2;background:transparent;cursor:pointer}
.thumb{position:absolute;inset:0;z-index:2;background:#000 center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .25s}
.thumb.hide{opacity:0;pointer-events:none}
.pbtn{width:66px;height:66px;border-radius:50%;background:rgba(14,165,233,.92);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;padding-left:5px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.wm{position:absolute;z-index:2;pointer-events:none;font-size:11px;font-weight:600;color:#fff;opacity:.45;text-shadow:0 1px 3px #000;white-space:nowrap;transition:top 3s ease-in-out,left 3s ease-in-out}
/* live meet screen */
.live{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;background:radial-gradient(circle at 50% 30%,#1b2a4a,#070c18 75%)}
.badge{display:inline-flex;align-items:center;gap:7px;background:#dc2626;color:#fff;font-size:12px;font-weight:800;letter-spacing:1.2px;padding:5px 14px;border-radius:20px}
.badge i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.live h2{font-size:clamp(13px,3.4vw,22px);letter-spacing:1.5px;font-weight:800}
.live p{font-size:clamp(11px,2.8vw,15px);color:var(--mut);max-width:90%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.join{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;text-decoration:none;font-weight:700;font-size:clamp(12px,3.2vw,16px);padding:clamp(9px,2.2vw,14px) clamp(16px,5vw,30px);border-radius:12px;box-shadow:0 8px 22px rgba(34,197,94,.35)}
.err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;font-size:13px;line-height:1.6;color:var(--mut);background:#0b1220}
.err b{color:var(--txt)}
/* info + playlist */
.info{padding:14px;border-bottom:1px solid var(--line)}
.info h2{font-size:17px;font-weight:700;line-height:1.35;margin:6px 0 10px}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 9px;border-radius:20px}
.t-live{background:#dc2626;color:#fff}.t-rec{background:#0c4a6e;color:#7dd3fc}
.dl{display:inline-flex;align-items:center;gap:8px;background:var(--pri);color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:10px 18px;border-radius:10px}
.dl.off{display:none}
.pl-h{padding:14px 14px 8px;font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;margin:0 10px 8px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.2s}
.item:hover{border-color:var(--pri)}
.item.on{border-color:var(--pri);background:#0f2a44}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:#1b2a4a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut)}
.item.on .num{background:var(--pri);color:#fff}
.item .tx{flex:1;min-width:0}.item .tt{font-size:13px;font-weight:600;line-height:1.35}
.item .st{font-size:11px;color:var(--mut);margin-top:3px}
.item .st .lv{color:#f87171;font-weight:700}
.msg{padding:40px 20px;text-align:center;color:var(--mut);font-size:14px;line-height:1.7}
.msg a{color:var(--pri);font-weight:600}
.plyr__controls{padding-bottom:6px}
</style>
</head>
<body>
<header class="top"><a href="index.html" title="Back">&#8592;</a><h1>Live &amp; Recorded Classes</h1></header>
<div class="wrap">
  <div class="stage"><div class="box"><div class="in" id="stage"><div class="err">Loading…</div></div></div></div>
  <div class="info" id="info" style="display:none"></div>
  <div class="pl-h" id="plh" style="display:none">Class Playlist</div>
  <div id="list"><div class="msg">Loading classes…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
/* ========== FIREBASE CONFIG (same project as your index.html / admin panel) ========== */
firebase.initializeApp({
  apiKey: "AIzaSyBeZl52HEWGz-vE72QZ5taznvpYTfq3QUk",
  authDomain: "login-and-reg-5728d.firebaseapp.com",
  projectId: "login-and-reg-5728d",
  storageBucket: "login-and-reg-5728d.firebasestorage.app",
  messagingSenderId: "435846403197",
  appId: "1:435846403197:web:d6a05a55e40839d15dcd14"
});
const auth = firebase.auth(), db = firebase.firestore();
const PHONE_DOMAIN = '@phone.gyanautomation.app';
const BATCH = new URLSearchParams(location.search).get('batch') || '';   // optional: player.html?batch=BATCH_ID

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let classes = [], curId = null, curSig = '', plyr = null, hls = null, wmTimer = null, me = { label: 'Student' };
let access = { admin: false, batches: new Set() }, unsubClasses = null;

/* ---------- SECURITY (deterrent only – real protection = Firestore rules + DRM/hosted player) ---------- */
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if(e.key === 'F12' || (e.ctrlKey && ['u','s','p'].includes(k)) || (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(k)) || (e.metaKey && e.altKey && ['i','j','u','c'].includes(k))){
    e.preventDefault(); e.stopPropagation(); return false;
  }
}, true);

/* ---------- helpers ---------- */
function ytId(c){ try{ const id = atob(c.src); return /^[\w-]{11}$/.test(id) ? id : null; }catch(e){ return null; } }
function notesHref(u){
  if(!/^https?:\/\//i.test(u || '')) return '';
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/.*[?&]id=([\w-]+)/);
  return m ? 'https://drive.google.com/uc?export=download&id=' + m[1] : u;
}
const isLive = c => c.mode === 'meet' || c.mode === 'live';
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';

function cleanup(){
  clearInterval(wmTimer);
  if(plyr){ try{ plyr.destroy(); }catch(e){} plyr = null; }
  if(hls){ try{ hls.destroy(); }catch(e){} hls = null; }
  $('stage').innerHTML = '';
}
function watermark(parent){
  const d = document.createElement('div'); d.className = 'wm'; d.textContent = me.label; parent.appendChild(d);
  const mv = () => { d.style.top = (8 + Math.random() * 70) + '%'; d.style.left = (3 + Math.random() * 55) + '%'; };
  mv(); wmTimer = setInterval(mv, 6000);
}
const PLYR_OPTS = { controls: ['play','progress','current-time','mute','volume','settings','fullscreen'], settings: ['quality','speed'], keyboard: { focused: true, global: false }, tooltips: { controls: false, seek: true } };

/* ---------- UNIVERSAL PLAYBACK HANDLER ---------- */
function play(c){
  cleanup();
  const st = $('stage');
  const fail = html => { st.innerHTML = '<div class="err"><div>' + html + '</div></div>'; };

  // 1) Google Meet live class
  if(c.mode === 'meet' || c.kind === 'meet'){
    const url = /^https:\/\/(meet\.google\.com|g\.co\/meet)\//i.test(c.src || '') ? c.src : '';
    if(!url) return fail('Meet link invalid hai. Admin panel me class edit karo.');
    st.innerHTML = '<div class="live"><span class="badge"><i></i>LIVE</span><h2>LIVE CLASS IN PROGRESS</h2><p>' + esc(c.title) + '</p><a class="join" target="_blank" rel="noopener" href="' + esc(url) + '">Join Live on Google Meet</a></div>';
    return;
  }

  // 2) YouTube (recorded or live) -> Plyr
  if(c.kind === 'youtube'){
    const id = ytId(c);
    if(!id) return fail('Video ID decode nahi hui. Admin panel me link dobara save karo.');
    if(location.protocol === 'file:') return fail('<b>YouTube Error 153</b><br>Page file:// se khula hai. Ise <b>https://</b> link (hosting / GitHub Pages) se kholo.');
    st.innerHTML = '<div id="yt" data-plyr-provider="youtube" data-plyr-embed-id="' + id + '"></div>';
    const p = plyr = new Plyr('#yt', Object.assign({}, PLYR_OPTS, {
      clickToPlay: false, ratio: '16:9',
      youtube: { rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, cc_load_policy: 0, disablekb: 1 }
    }));
    const w = p.elements.wrapper;
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    thumb.style.backgroundImage = 'url(https://i.ytimg.com/vi/' + id + '/hqdefault.jpg)';
    thumb.innerHTML = '<span class="pbtn">&#9654;</span>';
    const shield = document.createElement('div'); shield.className = 'shield';       // bottom 45px stays free for controls
    w.appendChild(shield); w.appendChild(thumb); watermark(w);
    shield.onclick = () => p.togglePlay();
    shield.ondblclick = () => p.fullscreen.toggle();
    thumb.onclick = () => p.play();
    p.on('playing', () => thumb.classList.add('hide'));
    p.on('pause', () => setTimeout(() => { if(plyr === p && p.paused) thumb.classList.remove('hide'); }, 250));
    p.on('ended', () => thumb.classList.remove('hide'));
    return;
  }

  // 3) Direct MP4 / HLS -> Plyr
  if(c.kind === 'direct'){
    const url = safeUrl(c.src); if(!url) return fail('Video link https:// hona chahiye.');
    st.innerHTML = '<video id="v" playsinline webkit-playsinline preload="metadata"></video>';
    const v = $('v'), isHls = /\.m3u8(\?|$)/i.test(url);
    if(isHls && window.Hls && Hls.isSupported()){ hls = new Hls(); hls.loadSource(url); hls.attachMedia(v); }
    else v.src = url;                                           // mp4, or Safari native HLS
    const p = plyr = new Plyr(v, Object.assign({}, PLYR_OPTS, { ratio: '16:9' }));
    watermark(p.elements.wrapper);
    return;
  }

  // 4) Third-party embed (Bunny Stream / VdoCipher / Vimeo / Drive ...) -> full-bleed iframe
  const url = safeUrl(c.src); if(!url) return fail('Embed link https:// hona chahiye.');
  st.innerHTML = '<iframe src="' + esc(url) + '" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>';
  watermark(st);
}

/* ---------- UI ---------- */
function renderInfo(c){
  const n = notesHref(c.notes), live = isLive(c);
  $('info').style.display = 'block';
  $('info').innerHTML = '<span class="tag ' + (live ? 't-live' : 't-rec') + '">' + (live ? '● LIVE' : 'RECORDED') + '</span><h2>' + esc(c.title) + '</h2>' +
    '<a class="dl ' + (n ? '' : 'off') + '" target="_blank" rel="noopener" href="' + esc(n) + '">&#11015; Download Notes (PDF)</a>';
}
function renderList(){
  $('plh').style.display = classes.length ? 'block' : 'none';
  $('list').innerHTML = classes.map((c, i) =>
    '<div class="item' + (c.id === curId ? ' on' : '') + '" data-id="' + esc(c.id) + '"><div class="num">' + (i + 1) + '</div><div class="tx"><div class="tt">' + esc(c.title) +
    '</div><div class="st">' + (isLive(c) ? '<span class="lv">● LIVE</span>' : 'Recorded') + (c.notes ? ' • Notes' : '') + '</div></div></div>').join('');
}
$('list').addEventListener('click', e => {
  const it = e.target.closest('.item'); if(!it) return;
  location.hash = it.dataset.id; select(it.dataset.id, true); window.scrollTo({ top: 0, behavior: 'smooth' });
});
function select(id, force){
  const c = classes.find(x => x.id === id); if(!c) return;
  const sig = [c.id, c.mode, c.kind, c.src].join('|');
  curId = id; renderList(); renderInfo(c);
  if(force || sig !== curSig){ curSig = sig; play(c); }
}
function gate(html){ cleanup(); $('stage').innerHTML = '<div class="err"><div>' + html + '</div></div>'; $('list').innerHTML = ''; $('info').style.display = 'none'; $('plh').style.display = 'none'; }

/* ---------- DATA (live updates: Live -> Recorded switch shows instantly) ---------- */
function start(){
  if(unsubClasses){ unsubClasses(); unsubClasses = null; }
  unsubClasses = db.collection('classes').orderBy('createdAt', 'asc').onSnapshot(snap => {
    classes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(!access.admin) classes = classes.filter(c => !c.batchId || access.batches.has(c.batchId));   // students: general + purchased batches only
    if(BATCH) classes = classes.filter(c => !c.batchId || c.batchId === BATCH);
    if(!classes.length){ gate('Abhi koi class available nahi hai.'); return; }
    const hash = decodeURIComponent(location.hash.slice(1));
    const want = [hash, curId].find(id => id && classes.some(c => c.id === id)) || (classes.find(isLive) || classes[0]).id;
    select(want, false);
  }, err => {
    gate(err.code === 'permission-denied' ? '<b>Permission denied</b><br>Firestore rules me <b>classes</b> collection ka read allow karo.' : esc(err.message));
  });
}
auth.onAuthStateChanged(async u => {
  if(!u){ if(unsubClasses){ unsubClasses(); unsubClasses = null; } gate('Classes dekhne ke liye pehle login karo.<br><br><a style="color:#0ea5e9;font-weight:700" href="index.html">Login / Open App</a>'); return; }
  let name = '', phone = '';
  try{ const d = await db.collection('users').doc(u.uid).get(); if(d.exists){ name = d.data().name || ''; phone = d.data().phone || ''; } }catch(e){}
  if(!phone && u.email && u.email.endsWith(PHONE_DOMAIN)) phone = u.email.replace(PHONE_DOMAIN, '');
  me.label = [name || (u.email ? u.email.split('@')[0] : 'Student'), phone].filter(Boolean).join(' • ');
  access = { admin: false, batches: new Set() };
  try{ access.admin = (await db.collection('admins').doc(u.uid).get()).exists; }catch(e){}
  if(!access.admin){
    try{
      const ps = await db.collection('users').doc(u.uid).collection('purchases').get();
      ps.forEach(d => { const x = d.data(); if(x.batchId && (!x.expiry || x.expiry > Date.now())) access.batches.add(x.batchId); });
    }catch(e){ console.warn('purchases', e); }
  }
  start();
});
window.addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if(id && id !== curId) select(id, true); });
</script>
</body>
</html>
